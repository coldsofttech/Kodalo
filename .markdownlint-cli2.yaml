config:
  MD013: false # line length
  MD033: false # inline HTML
  MD041: false # first line heading (some docs start with a subheading)
ignores:
  - docs/cli-reference.md # generated by Typer
  - "**/node_modules/**"
  - "**/dist/**"
  - .venv/**
  - build/**
  - .temp/** # local scratch files, not tracked
