name: Integration

# CI calls this on every pull request with one Python version. The schedule (and a manual run)
# covers every supported version, since the full matrix is slow and rarely differs.
on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python versions to test.
        type: string
        default: '["3.11"]'
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions || '["3.11","3.12","3.13","3.14","3.15"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # One step per component (tests/<component>/integration), so a failure names its area. The
      # UI's integration test needs the built frontend and Windows, so the ui-windows job in CI
      # runs it. faulthandler_timeout prints every thread's stack when a test hangs for 30 seconds.
      - name: Integration tests (core)
        run: uv run pytest -n auto -m integration tests/core --no-cov -o faulthandler_timeout=30
      - name: Integration tests (cli)
        if: ${{ !cancelled() }}
        run: uv run pytest -n auto -m integration tests/cli --no-cov -o faulthandler_timeout=30
      - name: Integration tests (api)
        if: ${{ !cancelled() }}
        run: uv run pytest -n auto -m integration tests/api --no-cov -o faulthandler_timeout=30
