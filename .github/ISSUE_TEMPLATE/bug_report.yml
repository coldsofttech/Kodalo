name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - Command line (kodalo)
        - API
        - UI window (kodalo-ui)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release (from `kodalo --version`) or commit you are using.
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Setup (installer)
        - Built from source
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version. For the UI window, also say if the Microsoft Edge WebView2 runtime is installed.
      placeholder: |
        Windows 11 23H2, WebView2 runtime installed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal information first.
