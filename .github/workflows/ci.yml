name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read project names
        shell: bash
        run: python3 installer/projectinfo.py github || python installer/projectinfo.py github
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix "$UI_DIR"
      - name: Check the OpenAPI document is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest # covered by the test job

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read project names
        shell: bash
        run: python3 installer/projectinfo.py github || python installer/projectinfo.py github
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.UI_DIR }}
      - run: npm run lint
        working-directory: ${{ env.UI_DIR }}
      - run: npm run format:check
        working-directory: ${{ env.UI_DIR }}
      - run: npm test
        working-directory: ${{ env.UI_DIR }}
      - run: npm run build
        working-directory: ${{ env.UI_DIR }}
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
          if-no-files-found: error

  # The installers bundle Python 3.13, so that is the version users run and the one tested.
  # One job per component (tests/<component>), so a failure names its area. Coverage is not
  # measured here, since a single component covers only part of the code.
  test:
    name: test (${{ matrix.component }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [core, cli, api, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked
      # faulthandler_timeout prints every thread's stack when a test hangs for 30 seconds.
      - run: uv run pytest -n auto tests/${{ matrix.component }} --no-cov -o faulthandler_timeout=30

  # The UI's tests need the built frontend and Windows, where Cornea Shell runs.
  integration:
    name: integration (${{ matrix.component }})
    needs: ui
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [core, cli, api, ui]
    steps:
      - uses: actions/checkout@v7
      - name: Read project names
        shell: bash
        run: python3 installer/projectinfo.py github || python installer/projectinfo.py github
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        if: matrix.component == 'ui'
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
      - run: uv sync --locked
      - run: uv run pytest -n auto -m integration tests/${{ matrix.component }} --no-cov -o faulthandler_timeout=30

  # Single required status check for the branch ruleset.
  ci:
    if: always()
    needs: [lint, ui, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "ui:          ${{ needs.ui.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.ui.result }}" = success ] &&
          [ "${{ needs.test.result }}" = success ] &&
          [ "${{ needs.integration.result }}" = success ]
